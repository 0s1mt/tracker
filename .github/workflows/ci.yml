name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels whatever CI run is still in
# flight for it - avoids burning minutes on a commit nobody cares about
# anymore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q
