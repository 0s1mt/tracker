name: "TEST: 3-forum 5-minute tracker"

# TEMPORARY validation workflow, not the production schedule - see
# pipeline.yml for that (full FORUM_POOL, every 30 minutes). This exists to
# prove the GitHub Actions architecture itself works end to end (no local
# machine, no Windows Task Scheduler, state surviving across ephemeral
# runners) on a small, fast, cheap slice before trusting it with the full
# pool: just the 3 forums asked for specifically - darkforums(.as),
# breachforums(bf.st), and pwnforums(.st). `--only-forums` (see
# pipeline.build_sources()) restricts the run to underground_forums alone
# with just those sites (substring-matched, so the "-leads" subforum
# variants come along too) and skips browser/Telegram/ransomware.live
# sources entirely, keeping each run fast enough for a 5-minute cadence.
#
# pwnforums is INTENTIONALLY not yet in FORUM_POOL (Cloudflare JS
# challenge, confirmed live - see underground_forums.py's pool comment and
# README) - until a real account cookie is wired in via
# BROWSER_FORUM_POOL's cookies_env support, this name simply matches
# nothing and that forum contributes 0 incidents every run, same as
# passing an unknown name - not a bug, see
# pipeline_test's test_build_sources_only_forums_with_no_match_yields_empty_pool.
#
# No Chromium/Playwright install step on purpose, unlike pipeline.yml:
# underground_forums' RSS fetch + text enrichment don't need a browser at
# all, only its optional screenshot phase does - without Chromium
# installed that phase just logs a warning and skips itself (see
# test_enrich_batch_skips_screenshots_when_playwright_not_installed),
# keeping every 5-minute run fast rather than paying a ~1-2 minute
# Chromium download on each one.
#
# Once this is confirmed working for real (check the Actions tab + the
# "test_3forum_cycle.json" report this commits each run), this workflow
# should be deleted/disabled and pipeline.yml's full-pool 30-minute
# schedule takes over for good - this is not meant to run forever
# alongside it.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: test_3forum
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: test3forum-state-${{ github.run_id }}
          restore-keys: |
            test3forum-state-

      - name: Run one cycle against darkforums + breachforums + pwnforums only
        run: |
          mkdir -p reports
          python -m forumtracker.cli --once --only-forums darkforums,breachforums,pwnforums \
            | tee reports/test_3forum_cycle.json

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: test3forum-state-${{ github.run_id }}

      - name: Commit updated report
        run: |
          git config user.name "darkweb-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/test_3forum_cycle.json
          git diff --cached --quiet || git commit -m "test_3forum: update from scheduled run [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
