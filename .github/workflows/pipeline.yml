name: Pipeline

# Runs one full tracker cycle (ingest -> dedup -> alert -> identity-correlate
# -> health-check -> stats-snapshot, all via pipeline.run_full_cycle - see
# its docstring) on a schedule, so the tracker keeps running without a
# local machine or an interactive session. A single push-triggered `--once`
# run wouldn't be "sustainable" on its own since GitHub Actions runners are
# ephemeral - state (dedup DB, health/stats/identity history) has to
# survive between runs on its own, which is what the cache step below is
# for.
#
# Schedule is every 30 minutes - looser than the app's own default
# poll_interval_seconds (900s/15min for underground_forums) on purpose, to
# keep the workflow-run count (and the state cache's growth) sustainable
# rather than maximal; tighten `cron` below if faster detection matters
# more than that.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Never run two cycles concurrently against the same cached state - a
# cycle that runs long (Playwright/Chromium screenshotting a big batch of
# new incidents) must finish and save its cache before the next one starts,
# not race it.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install Chromium for Playwright-based sources
        run: python -m playwright install --with-deps chromium

      # SQLite state (seen/health/forum_stats/identity) and the growing
      # incidents/alerts JSONL feeds live in data/, gitignored on purpose
      # (binary SQLite diffs are not git-friendly, see .gitignore) - a
      # rolling cache is what makes dedup, the health-check consecutive-
      # failure counter, and cross-forum identity matching persist across
      # otherwise-stateless runner instances. `restore-keys` falls back to
      # the most recent previous cache by prefix match; a brand new key
      # every run (via run_id) is required because a cache entry, once
      # created, is immutable - see actions/cache's docs on why "always
      # save a new key, always restore by prefix" is the idiom for state
      # that grows every run rather than a static dependency cache.
      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: tracker-state-${{ github.run_id }}
          restore-keys: |
            tracker-state-

      - name: Run one full pipeline cycle
        id: cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p reports
          python -m forumtracker.cli --once | tee reports/latest_cycle.json

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: tracker-state-${{ github.run_id }}

      - name: Commit updated reports
        run: |
          git config user.name "darkweb-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/latest_cycle.json
          git diff --cached --quiet || git commit -m "reports: update from scheduled pipeline run [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
